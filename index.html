<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#DE0D18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gerenciador Casa" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <title>Gerenciador Casa</title>
    <meta name="description" content="Gerenciador Casa — tarefas da equipe da casa, do jeito simples.">
    <meta name="author" content="Lovable" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta property="og:title" content="Gerenciador Casa">
    <meta name="twitter:title" content="Gerenciador Casa">
    <meta property="og:description" content="Gerenciador Casa — tarefas da equipe da casa, do jeito simples.">
    <meta name="twitter:description" content="Gerenciador Casa — tarefas da equipe da casa, do jeito simples.">
    <style>
      /* Splash/loading screen shown before React mounts */
      #splash-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 99999;
        transition: opacity 0.4s ease-out;
      }
      #splash-loader.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash-loader .splash-emoji {
        
        margin-bottom: 1rem;
        animation: splash-bounce 1.2s ease-in-out infinite;
      }
      #splash-loader .splash-title {
        font-family: 'Georgia', serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: #DE0D18;
        margin-bottom: 1.5rem;
      }
      #splash-loader .splash-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #f6d3d5;
        border-top-color: #DE0D18;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes splash-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
    </style>
  </head>
  <body>
    <div id="splash-loader">
      <img class="splash-emoji" src="/logo.png" alt="" width="120" height="117" />
      <div class="splash-title">Gerenciador Casa</div>
      <div class="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
